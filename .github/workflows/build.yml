name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Recuperar a chave de assinatura (segredo do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta o segredo KEYSTORE_BASE64 em Settings > Secrets and variables > Actions"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/cabine.keystore

      - name: Compilar o app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk cabine-divertida-v0.1.${{ github.run_number }}.apk

      - name: Guardar o APK no build
        uses: actions/upload-artifact@v4
        with:
          name: cabine-divertida-apk
          path: cabine-divertida-*.apk

      - name: Publicar em Releases (link para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Cabine Divertida 0.1.${{ github.run_number }}
          body: Baixe o arquivo .apk abaixo pelo celular Android e toque para instalar.
          files: cabine-divertida-*.apk
          make_latest: true
